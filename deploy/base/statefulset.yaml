apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: doq
spec:
  serviceName: doq-internal
  # Start all pods at once. Raft needs a quorum (2 of 3) to elect a leader, and
  # readiness (/readyz) depends on having a leader. With the default OrderedReady
  # policy the controller waits for doq-0 to become Ready before creating doq-1,
  # which deadlocks on a cold start (e.g. all pods killed together): doq-0 can
  # never reach quorum alone, so the peers are never created. Parallel avoids it.
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app: doq
  template:
    metadata:
      labels:
        app: doq
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: doq
      containers:
        - name: doq
          image: "kgantsov/doq:latest"
          command:
            - "/app"
            - "--cluster.service_name"
            - "doq"
            # "auto" seeds the Raft cluster from the ordinal-0 pod (doq-0) and
            # makes every other pod join it, so the cluster never fragments into
            # isolated Raft groups. Set to "true"/"false" only to force a
            # specific node's role.
            - "--cluster.bootstrap"
            - "auto"
            - "--http.port"
            - "8000"
            - "--grpc.address"
            - "0.0.0.0:10000"
            - "--raft.address"
            - "9000"
            - "--prometheus.enabled"
            - "true"
            - "--storage.data_dir"
            - "/usr/local/doq/data"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /usr/local/doq/data
          resources:
            requests:
              cpu: 1000m
              memory: 100Mi
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /livez
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /readyz
              port: 8000
              scheme: HTTP
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 2
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsGroup: 10001

  updateStrategy:
    type: OnDelete

  volumeClaimTemplates:
    - kind: PersistentVolumeClaim
      metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 5Gi
        volumeMode: Filesystem
